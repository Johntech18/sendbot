# Render.com blueprint — deploys this repo as a free web service.
# Deploy via Render dashboard: New + > Blueprint, or "render blueprint launch" with the CLI.
services:
  - type: web
    name: bigreel-match-notifier
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # set in dashboard — secret
      - key: TELEGRAM_CHAT_ID
        sync: false          # set in dashboard — secret
      - key: SPORTS
        value: football
      - key: LEAD_MINUTES
        value: "5"
      - key: SITE_BASE_URL
        value: https://sports.bigreel.com.ng
